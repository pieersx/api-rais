name: Deploy API to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/deploy/deploy-ec2.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets and variables
        run: |
          test -n "${{ secrets.EC2_SSH_PRIVATE_KEY }}" || (echo "Missing secret EC2_SSH_PRIVATE_KEY" && exit 1)
          test -n "${{ secrets.EC2_HOST }}" || (echo "Missing secret EC2_HOST" && exit 1)
          test -n "${{ secrets.EC2_SSH_USER }}" || (echo "Missing secret EC2_SSH_USER" && exit 1)
          test -n "${{ secrets.DB_PASSWORD }}" || (echo "Missing secret DB_PASSWORD" && exit 1)
          test -n "${{ secrets.DB_HOST }}" || (echo "Missing secret DB_HOST" && exit 1)
          test -n "${{ secrets.DB_USER }}" || (echo "Missing secret DB_USER" && exit 1)
          test -n "${{ secrets.DB_NAME }}" || (echo "Missing secret DB_NAME" && exit 1)
          test -n "${{ secrets.BASE_URL }}" || (echo "Missing secret BASE_URL" && exit 1)
          test -n "${{ secrets.ADMIN_EMAIL }}" || (echo "Missing secret ADMIN_EMAIL" && exit 1)

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts || true

      - name: Deploy to EC2
        env:
          EC2_SSH_USER: ${{ secrets.EC2_SSH_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          SSH_KEY_PATH: ~/.ssh/deploy_key
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          BASE_URL: ${{ secrets.BASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          PAGE_SIZE: ${{ secrets.PAGE_SIZE }}
        run: bash scripts/deploy/deploy-ec2.sh

      - name: Verify deployment
        run: |
          sleep 5
          curl -f "http://${{ secrets.EC2_HOST }}/health" && echo "Health check passed" || echo "Health check failed"
