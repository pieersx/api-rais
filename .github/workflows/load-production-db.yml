name: Load Production Database

on:
  workflow_dispatch:
    inputs:
      backup_file:
        description: 'Backup file path in database/dumps/'
        required: false
        default: 'raw/backup-rais-29-05-26.sql'

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.DB_HOST }}" || (echo "Missing secret: DB_HOST" && exit 1)
          test -n "${{ secrets.DB_USER }}" || (echo "Missing secret: DB_USER" && exit 1)
          test -n "${{ secrets.DB_PASSWORD }}" || (echo "Missing secret: DB_PASSWORD" && exit 1)
          test -n "${{ secrets.DB_NAME }}" || (echo "Missing secret: DB_NAME" && exit 1)
          test -n "${{ secrets.EC2_SSH_PRIVATE_KEY }}" || (echo "Missing secret: EC2_SSH_PRIVATE_KEY" && exit 1)
          test -n "${{ secrets.EC2_HOST }}" || (echo "Missing secret: EC2_HOST" && exit 1)
          test -n "${{ secrets.EC2_SSH_USER }}" || (echo "Missing secret: EC2_SSH_USER" && exit 1)

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Download and execute import script in EC2
        env:
          EC2_SSH_USER: ${{ secrets.EC2_SSH_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          echo "=== INICIANDO IMPORTACIÓN DE BACKUP EN EC2 ==="
          echo ""
          
          # Descargar e instalar el script de importación en EC2
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              "$EC2_SSH_USER@$EC2_HOST" \
              "bash -s" << 'EOFCMD'
          
          echo "📥 Descargando script de importación..."
          curl -fsSL https://raw.githubusercontent.com/pieersx/api-rais/main/scripts/db/import-from-github.sh -o /tmp/import.sh
          chmod +x /tmp/import.sh
          
          echo "🚀 Ejecutando importación..."
          export DB_HOST="$DB_HOST"
          export DB_PORT="$DB_PORT"
          export DB_USER="$DB_USER"
          export DB_PASSWORD="$DB_PASSWORD"
          export DB_NAME="$DB_NAME"
          bash /tmp/import.sh
          
          EXIT_CODE=$?
          rm -f /tmp/import.sh
          exit $EXIT_CODE
          
          EOFCMD
          
          if [ $? -eq 0 ]; then
            echo ""
            echo "✅ IMPORTACIÓN COMPLETADA EXITOSAMENTE"
          else
            echo ""
            echo "❌ Falló la importación en EC2"
            exit 1
          fi

      - name: Deployment status
        if: success()
        run: |
          echo "✅ Base de datos de producción actualizada exitosamente"
          echo "📌 Próximo paso: Hacer push a main para redesplegarse la API"

      - name: Failure notification
        if: failure()
        run: |
          echo "❌ Fallo durante la importación"
          echo "📌 Revisar logs arriba para detalles"
          exit 1
